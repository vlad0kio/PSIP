<!DOCTYPE html>
<html lang="ru">
<head>

    <title>Уланович Владислав Дмитриевич</title>
    <style>
        body {
            background-image: url("images/back.jpg");
            background-size: cover;
            background-repeat: repeat;
            background-position: center;

            height: 100vh;
            margin: 0; 
            font-family: 'Times New Roman', Times, serif;

        .fio {

        }
        .hobbies {

        }

          background-color: yellow; /* Цвет фона ячейки */
        }
        .green {

        .iimg {
            display: block;
            margin: 0 auto;
            width: 100px;
            height: 200px;
            border: 3px solid rgb(0, 8, 255);
        }
        img{
          width: 100px;
          height: 200px;
        }
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
        }
        th, td {
            padding: 5px;
            text-align: left;
        }
    </style>
</head>
