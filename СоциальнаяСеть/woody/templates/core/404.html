<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница не найдена</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            padding: 50px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
        }
        .icon {
            font-size: 120px;
            margin-bottom: 30px;
            color: #ff6b6b;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        p {
            color: #666;
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }
        .btn {
            padding: 14px 30px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-primary {
            background: #1877f2;
            color: white;
        }
        .btn-secondary {
            background: white;
            color: #1877f2;
            border: 2px solid #1877f2;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🔍❌</div>
        <h1>Страница не найдена</h1>
        <p>
            Запрашиваемая страница не существует. Возможно, она была удалена или перемещена.
        </p>
        <div class="buttons">
            <a href="{% url 'feed' %}" class="btn btn-primary">На главную</a>
            <a href="{% url 'search_friends' %}" class="btn btn-secondary">Поиск друзей</a>
        </div>
    </div>
</body>
</html>
